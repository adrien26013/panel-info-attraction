<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Contrôle Organisé - Le Drakkar</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f3f8; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 750px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #005096; text-align: center; margin-top: 0; border-bottom: 3px solid #005096; padding-bottom: 12px; }
        .grid-sections { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }
        .section { background: #fafbfc; border: 1px solid #dcdfe6; border-radius: 8px; padding: 18px; }
        .section-title { font-weight: bold; font-size: 16px; color: #005096; margin-bottom: 15px; display: block; border-left: 4px solid #005096; padding-left: 8px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 14px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #dcdfe6; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .flex-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        
        .btn-update { background-color: #005096; color: white; width: 100%; margin-top: 10px; }
        .btn-update:hover { background-color: #003666; }
        .btn-secu { background-color: #ff9800; color: white; }
        .btn-secu:hover { background-color: #e68a00; }
        .btn-tech { background-color: #17a2b8; color: white; }
        .btn-tech:hover { background-color: #138496; }
        .btn-ferm { background-color: #6f42c1; color: white; }
        .btn-ferm:hover { background-color: #59339d; }
        .btn-stop { background-color: #dc3545; color: white; flex: 2; }
        .btn-stop:hover { background-color: #bd2130; }
        .btn-yes { background-color: #28a745; color: white; }
        .btn-yes:hover { background-color: #218838; }
        .btn-no { background-color: #dc3545; color: white; }
        .btn-no:hover { background-color: #c82333; }
        .btn-reset { background-color: #6c757d; color: white; width: 100%; margin-top: 10px; }
        .btn-reset:hover { background-color: #5a6268; }
    </style>
</head>
<body>

<div class="container">
    <h2>PANEL OPÉRATEUR - LE DRAKKAR</h2>
    
    <div class="grid-sections">
        
        <div class="section">
            <span class="section-title">Diffusion des Consignes Prioritaires</span>
            <div class="flex-group" style="margin-bottom: 10px;">
                <button class="btn-secu" onclick="sendCommand('SECURITE')">SÉCURITÉ</button>
                <button class="btn-tech" onclick="sendCommand('TECHNIQUE')">TECHNIQUE</button>
                <button class="btn-ferm" onclick="sendCommand('FERMETURE')">FERMETURE</button>
            </div>
            <div class="flex-group">
                <button class="btn-stop" onclick="sendCommand('STOP_ANNONCE')">ARRÊTER L'ANNONCE EN COURS (RETOUR PUB)</button>
            </div>
        </div>

        <div class="section">
            <span class="section-title">Case Information Défilante Screen</span>
            <div class="form-group">
                <label for="info_message">Message diffusé (Utilise \n pour créer plusieurs pages alternées) :</label>
                <input type="text" id="info_message" placeholder="Ex: Bienvenue au Drakkar !\nAttention aux éclaboussures !">
            </div>
            <button class="btn-update" onclick="updateInfoText()">METTRE À JOUR LE TEXTE</button>
        </div>

        <div class="section">
            <span class="section-title">Calcul Automatique du Temps d'Attente</span>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label for="capa_heure">Capacité horaire (pers/h) :</label>
                    <input type="number" id="capa_heure" value="800">
                </div>
                <div class="form-group">
                    <label for="personnes">Personnes dans la file :</label>
                    <input type="number" id="personnes" value="0">
                </div>
                <div class="form-group">
                    <label for="intervalle_secu">Fréquence annonce sécu (sec) :</label>
                    <input type="number" id="intervalle_secu" value="120">
                </div>
                <div class="form-group">
                    <label for="intervalle_calcul">Intervalle Rafraîchissement (sec) :</label>
                    <input type="number" id="intervalle_calcul" value="7">
                </div>
            </div>
            <button class="btn-update" onclick="updateCalculParams()">METTRE À JOUR LES PARAMÈTRES ET LE COMPTEUR</button>
        </div>

        <div class="section">
            <span class="section-title">Affichage de l'attente sur la TV (OUI / NON)</span>
            <label style="margin-bottom: 10px;">Souhaitez-vous afficher la section "Attente Estimée" aux visiteurs ?</label>
            <div class="flex-group">
                <button class="btn-yes" onclick="setWaitTimeDisplay(true)">OUI (Afficher le bandeau)</button>
                <button class="btn-no" onclick="setWaitTimeDisplay(false)">NON (Masquer le bandeau)</button>
            </div>
        </div>

        <div class="section">
            <span class="section-title">Gestion de la Musique d'Ambiance Distante</span>
            <div class="form-group">
                <label for="music_url">Lien URL direct de la Musique (MP3 / Flux Stream) :</label>
                <input type="text" id="music_url" placeholder="Laissez vide pour utiliser la musique locale du RPi">
            </div>
            <button class="btn-update" style="background-color: #008080;" onclick="updateMusicUrl()">APPLIQUER LA MUSIQUE À DISTANCE</button>
        </div>

        <div class="section">
            <span class="section-title">Contrôle et Forçage Horaire</span>
            <div class="flex-group">
                <button class="btn-yes" style="background-color: #1e7e34;" onclick="setManualForce('OPEN')">FORCER L'OUVERTURE</button>
                <button class="btn-no" style="background-color: #bd2130;" onclick="setManualForce('CLOSE')">FORCER LA FERMETURE</button>
            </div>
            <button class="btn-reset" onclick="setManualForce('RESET')">REPASSER EN MODE AUTOMATIQUE (SUIVRE PLANNING)</button>
        </div>

    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // Configuration officielle injectée de ton projet "attraction-info"
    const firebaseConfig = {
        apiKey: "AIzaSyDWob3NIJTPxrdpreSpDr__eaPJA2ZCTl0",
        authDomain: "attraction-info.firebaseapp.com",
        databaseURL: "https://attraction-info-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "attraction-info",
        storageBucket: "attraction-info.firebasestorage.app",
        messagingSenderId: "335011135222",
        appId: "1:335011135222:web:db513acd348e55e20c76d7"
    };
    
    // Initialisation
    firebase.initializeApp(firebaseConfig);
    
    const RASPBERRY_ID = "attraction_36";
    const dbRef = firebase.database().ref('attractions/' + RASPBERRY_ID);

    // Synchronisation automatique en réception (remplit les inputs si changés ailleurs)
    dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            if (data.info_message !== undefined && document.activeElement !== document.getElementById('info_message')) {
                document.getElementById('info_message').value = data.info_message;
            }
            if (data.capa_heure !== undefined && document.activeElement !== document.getElementById('capa_heure')) {
                document.getElementById('capa_heure').value = data.capa_heure;
            }
            if (data.personnes !== undefined && document.activeElement !== document.getElementById('personnes')) {
                document.getElementById('personnes').value = data.personnes;
            }
            if (data.intervalle_secu !== undefined && document.activeElement !== document.getElementById('intervalle_secu')) {
                document.getElementById('intervalle_secu').value = data.intervalle_secu;
            }
            if (data.intervalle_calcul !== undefined && document.activeElement !== document.getElementById('intervalle_calcul')) {
                document.getElementById('intervalle_calcul').value = data.intervalle_calcul;
            }
            if (data.music_url !== undefined && document.activeElement !== document.getElementById('music_url')) {
                document.getElementById('music_url').value = data.music_url;
            }
        }
    });

    function sendCommand(cmdName) {
        console.log("[WEB PANEL] Click commande : " + cmdName);
        dbRef.update({ commande_test: cmdName });
    }

    function setWaitTimeDisplay(isVisible) {
        console.log("[WEB PANEL] Click affichage attente : " + isVisible);
        dbRef.update({ show_wait_time: isVisible });
    }

    function updateMusicUrl() {
        const urlValue = document.getElementById('music_url').value.trim();
        console.log("[WEB PANEL] Click musique distante : " + urlValue);
        dbRef.update({ music_url: urlValue });
    }

    function setManualForce(mode) {
        console.log("[WEB PANEL] Click mode horaire : " + mode);
        if (mode === 'OPEN') {
            dbRef.update({ force_open_panel: true, force_close_panel: false });
        } else if (mode === 'CLOSE') {
            dbRef.update({ force_open_panel: false, force_close_panel: true });
        } else {
            dbRef.update({ force_open_panel: false, force_close_panel: false });
        }
    }

    function updateInfoText() {
        const text = document.getElementById('info_message').value;
        console.log("[WEB PANEL] Click mise à jour texte : " + text);
        dbRef.update({ info_message: text });
    }

    function updateCalculParams() {
        console.log("[WEB PANEL] Click mise à jour paramètres numériques...");
        dbRef.update({
            capa_heure: parseInt(document.getElementById('capa_heure').value) || 800,
            personnes: parseInt(document.getElementById('personnes').value) || 0,
            intervalle_secu: parseInt(document.getElementById('intervalle_secu').value) || 120,
            intervalle_calcul: parseInt(document.getElementById('intervalle_calcul').value) || 7
        });
    }
</script>
</body>
</html>
