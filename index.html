<div class="panel-section" style="border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-top: 15px; font-family: Arial, sans-serif;">
    <h3 style="margin-top: 0;">Configuration de l'Affichage de l'Écran</h3>
    
    <label style="font-weight: bold; display: block; margin-bottom: 10px;">
        Afficher le Temps d'Attente Estimé sur l'Écran :
    </label>
    
    <button id="btn_wait_yes" onclick="setWaitTimeDisplay(true)" style="background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px;">
        OUI (Afficher)
    </button>
    
    <button id="btn_wait_no" onclick="setWaitTimeDisplay(false)" style="background-color: #f44336; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
        NON (Masquer)
    </button>
</div>

<script>
// Exemple de fonction JavaScript de liaison Firebase Database pour ton site
function setWaitTimeDisplay(isVisible) {
    // Remplacer RASPBERRY_ID par ton ID configuré (ex: attraction_36)
    const raspberryId = "TON_RASPBERRY_ID"; 
    
    firebase.database().ref('attractions/' + raspberryId).update({
        show_wait_time: isVisible
    })
    .then(() => {
        console.log("Visibilité de l'attente modifiée : " + isVisible);
        alert("L'affichage sur la TV a été mis à jour !");
    })
    .catch((error) => {
        console.error("Erreur Firebase : ", error);
    });
}
</script>
