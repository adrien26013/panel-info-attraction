<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Panel Drakkar | Admin Complet</title>
    <style>
        :root { --primary: #005096; --danger: #dc3545; --success: #28a745; --info: #17a2b8; --bg: #f0f3f8; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 950px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card-title { font-weight: bold; color: var(--primary); margin-bottom: 15px; display: block; border-left: 4px solid var(--primary); padding-left: 8px; }
        input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; cursor: pointer; }
        .btn-update { background: var(--primary); color: white; font-weight: bold; }
        
        /* Overlay chargement */
        #loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); color:white; flex-direction:column; justify-content:center; align-items:center; z-index:1000; }
        #progress-container { width: 80%; max-width: 400px; background: #333; border-radius: 10px; overflow: hidden; margin-top: 20px; }
        #progress-bar { width: 0%; height: 20px; background: var(--info); transition: width 0.3s; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div id="status-text" style="font-size:20px; margin-bottom:10px;">Envoi en cours...</div>
    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="percent-text" style="margin-top:10px;">0%</div>
</div>

<div class="container">
    <h2>PANEL OPÉRATEUR - DRAKKAR</h2>
    <div class="grid">
        <div class="card">
            <span class="card-title">⚙️ Paramètres & Musique</span>
            <input type="file" id="file_music" accept="audio/mp3">
            <button class="btn-update" onclick="uploadMusic()" style="background:var(--info);">CHARGER MUSIQUE MP3</button>
        </div>
        </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

    const firebaseConfig = { /* Vos paramètres Firebase */ };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'attractions/DRAKKAR');
    const storage = getStorage(app);

    window.uploadMusic = () => {
        const file = document.getElementById('file_music').files[0];
        if(!file) return alert("Sélectionnez un MP3");

        const overlay = document.getElementById('loading-overlay');
        const progressBar = document.getElementById('progress-bar');
        const percentText = document.getElementById('percent-text');
        overlay.style.display = 'flex';

        const sRef = storageRef(storage, 'musiques/DRAKKAR_ambiance.mp3');
        const uploadTask = uploadBytesResumable(sRef, file);

        uploadTask.on('state_changed', 
            (snapshot) => {
                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                progressBar.style.width = progress + '%';
                percentText.innerText = Math.round(progress) + '%';
            }, 
            (error) => {
                overlay.style.display = 'none';
                alert("Erreur : " + error.message);
            }, 
            async () => {
                const url = await getDownloadURL(uploadTask.snapshot.ref);
                await update(dbRef, { music_url: url });
                overlay.style.display = 'none';
                alert("✅ Succès : La musique a bien été mise à jour !");
            }
        );
    };
</script>
</body>
</html>
