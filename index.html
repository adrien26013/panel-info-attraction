<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Panel Drakkar | Admin Complet</title>
    <style>
        :root { --primary: #005096; --danger: #dc3545; --success: #28a745; --info: #17a2b8; --bg: #f0f3f8; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 950px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card-title { font-weight: bold; color: var(--primary); margin-bottom: 15px; display: block; border-left: 4px solid var(--primary); padding-left: 8px; }
        input, button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; cursor: pointer; }
        .btn-update { background: var(--primary); color: white; font-weight: bold; }
        
        #loading-overlay, #success-popup { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); color:white; flex-direction:column; justify-content:center; align-items:center; z-index:1000; }
        #success-popup { background:rgba(0,0,0,0.9); }
        #progress-container { width: 80%; max-width: 400px; background: #333; border-radius: 10px; overflow: hidden; margin-top: 20px; }
        #progress-bar { width: 0%; height: 20px; background: #17a2b8; transition: width 0.3s; }
        .time-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 10px; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div id="status-text" style="font-size:20px; margin-bottom:10px;">Envoi en cours...</div>
    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="percent-text" style="margin-top:10px;">0%</div>
    <button onclick="cancelUpload()" style="width:auto; margin-top:20px; background:var(--danger); color:white; border:none;">ANNULER</button>
</div>

<div id="success-popup" onclick="this.style.display='none'">
    <div style="font-size:30px; margin-bottom:10px;">✅</div>
    <div style="font-size:20px;">Synchronisation effectuée avec succès !</div>
</div>

<div class="container">
    <h2>PANEL OPÉRATEUR - DRAKKAR</h2>
    <div class="grid">
        <div class="card">
            <span class="card-title">🚨 Annonces Prioritaires</span>
            <button onclick="sendCommand('SECURITE')" style="background:#f39c12; color:white;">SÉCURITÉ</button>
            <button onclick="sendCommand('TECHNIQUE')" style="background:var(--info); color:white;">TECHNIQUE</button>
            <button onclick="sendCommand('FERMETURE')" style="background:#6c757d; color:white;">FERMETURE</button>
        </div>

        <div class="card">
            <span class="card-title">⚙️ Paramètres & Musique</span>
            <input type="number" id="capacite" placeholder="Capacité (Personne / heure)">
            
            <label style="font-size:12px;">Intervalle calcul attente (Secondes) :</label>
            <input type="number" id="int_calc">
            
            <label style="font-size:12px;">Diffusion sécurité (H / M / S) :</label>
            <div class="time-group">
                <input type="number" id="secu_h" placeholder="H">
                <input type="number" id="secu_m" placeholder="M">
                <input type="number" id="secu_s" placeholder="S">
            </div>
            <button class="btn-update" onclick="updateParams()">VALIDER PARAMÈTRES</button>
            <hr>
            <input type="file" id="file_music" accept="audio/mp3">
            <button class="btn-update" onclick="uploadMusic()" style="background:var(--info);">CHARGER MUSIQUE MP3</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

    const app = initializeApp({
        apiKey: "AIzaSyDWob3NIJTPxrdpreSpDr__eaPJA2ZCTl0",
        databaseURL: "https://attraction-info-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "attraction-info",
        storageBucket: "attraction-info.firebasestorage.app"
    });
    const db = getDatabase(app);
    const dbRef = ref(db, 'attractions/DRAKKAR');
    const storage = getStorage(app);
    let currentTask = null;

    window.showSuccess = () => {
        const p = document.getElementById('success-popup');
        p.style.display = 'flex';
        setTimeout(() => p.style.display = 'none', 3000);
    };

    window.sendCommand = (cmd) => update(dbRef, { commande_test: cmd }).then(() => showSuccess());

    window.updateParams = () => {
        const h = parseInt(document.getElementById('secu_h').value || 0);
        const m = parseInt(document.getElementById('secu_m').value || 0);
        const s = parseInt(document.getElementById('secu_s').value || 0);
        update(dbRef, { 
            capacite: document.getElementById('capacite').value,
            intervalle_calcul: parseInt(document.getElementById('int_calc').value || 0),
            intervalle_secu: (h * 3600) + (m * 60) + s
        }).then(() => showSuccess());
    };

    window.cancelUpload = () => { if(currentTask) currentTask.cancel(); document.getElementById('loading-overlay').style.display = 'none'; };

    window.uploadMusic = () => {
        const file = document.getElementById('file_music').files[0];
        if(!file) return alert("Sélectionnez un fichier");
        document.getElementById('loading-overlay').style.display = 'flex';
        currentTask = uploadBytesResumable(storageRef(storage, 'musique_ambiance_drakkar.mp3'), file);
        currentTask.on('state_changed', (snap) => {
            const progress = (snap.bytesTransferred / snap.totalBytes) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
            document.getElementById('percent-text').innerText = Math.round(progress) + '%';
        }, (err) => { alert(err); document.getElementById('loading-overlay').style.display = 'none'; }, () => {
            getDownloadURL(currentTask.snapshot.ref).then(url => {
                update(dbRef, { music_url: url }).then(() => {
                    document.getElementById('loading-overlay').style.display = 'none';
                    showSuccess();
                });
            });
        });
    };
</script>
</body>
</html>
