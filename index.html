<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Panel Drakkar | Admin</title>
    <style>
        :root { --primary: #2563eb; --danger: #ef4444; --success: #22c55e; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f3f8; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-title { font-weight: bold; color: #005096; margin-bottom: 15px; display: block; border-left: 4px solid #005096; padding-left: 8px; }
        input, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn-update { background: #005096; color: white; cursor: pointer; }
        .date-tag { display: inline-block; background: #e2e8f0; padding: 5px 10px; border-radius: 5px; margin: 2px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>PANEL OPÉRATEUR - DRAKKAR</h2>
    <div class="grid">
        <div class="card">
            <span class="card-title">🚨 Annonces Prioritaires</span>
            <button onclick="sendCommand('SECURITE')">SÉCURITÉ</button>
            <button onclick="sendCommand('TECHNIQUE')">TECHNIQUE</button>
            <button onclick="sendCommand('FERMETURE')">FERMETURE</button>
            <button onclick="sendCommand('STOP_ANNONCE')" style="background:var(--danger); color:white;">STOP TOUT</button>
        </div>

        <div class="card">
            <span class="card-title">📅 Planning & Dates</span>
            <input type="time" id="h_ouv" value="07:00">
            <input type="time" id="h_ferm" value="18:00">
            <input type="date" id="date_input">
            <button onclick="addDate()">AJOUTER DATE</button>
            <div id="date_list" style="margin:10px 0;"></div>
            <button class="btn-update" onclick="updateSchedule()">APPLIQUER PLANNING</button>
        </div>

        <div class="card">
            <span class="card-title">⚙️ Paramètres</span>
            <label>Affichage Attente :</label>
            <div style="display:flex; gap:5px;">
                <button onclick="setWaitTime(true)">OUI</button>
                <button onclick="setWaitTime(false)">NON</button>
            </div>
            <input type="number" id="int_calc" placeholder="Intervalle calcul (s)">
            <button class="btn-update" onclick="updateParams()">SAUVEGARDER</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDWob3NIJTPxrdpreSpDr__eaPJA2ZCTl0",
        databaseURL: "https://attraction-info-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "attraction-info",
        storageBucket: "attraction-info.firebasestorage.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'attractions/DRAKKAR');

    let selectedDates = [];

    window.addDate = () => {
        const d = document.getElementById('date_input').value;
        if(d && !selectedDates.includes(d)) {
            selectedDates.push(d);
            renderDates();
        }
    };

    function renderDates() {
        const container = document.getElementById('date_list');
        container.innerHTML = selectedDates.map(d => `<span class="date-tag" onclick="removeDate('${d}')">${d} ✕</span>`).join('');
    }

    window.removeDate = (d) => {
        selectedDates = selectedDates.filter(date => date !== d);
        renderDates();
    };

    window.updateSchedule = () => {
        update(dbRef, {
            horaires_ouverture: {
                h_ouverture: document.getElementById('h_ouv').value,
                h_fermeture: document.getElementById('h_ferm').value,
                dates_speciales: selectedDates
            }
        });
        alert("Planning mis à jour !");
    };

    window.sendCommand = (cmd) => update(dbRef, { commande_test: cmd });
    window.setWaitTime = (val) => update(dbRef, { show_wait_time: val });
    window.updateParams = () => update(dbRef, { intervalle_calcul: parseInt(document.getElementById('int_calc').value) });
</script>
</body>
</html>
