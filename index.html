<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Panel Drakkar | Admin Complet</title>

    <style>

        :root {
            --primary: #005096;
            --danger: #dc3545;
            --success: #28a745;
            --info: #17a2b8;
            --bg: #f0f3f8;
            --hover: #007bff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .card-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 15px;
            display: block;
            border-left: 4px solid var(--primary);
            padding-left: 8px;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        .btn-update {
            background: var(--primary);
            color: white;
            font-weight: bold;
        }

        .date-tag {
            display: inline-block;
            background: #e2e8f0;
            padding: 4px 8px;
            border-radius: 4px;
            margin: 2px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #cbd5e0;
        }

        .date-tag:hover {
            background: #dc3545;
            color: white;
        }

        #loading-overlay {
            display: none;
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.85);
            color:white;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            z-index:1000;
        }

        #progress-container {
            width: 80%;
            max-width: 400px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        #progress-bar {
            width: 0%;
            height: 20px;
            background: #17a2b8;
            transition: width 0.3s;
        }

        #success-popup {
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.8);
            color:white;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            z-index:2000;
        }

    </style>
</head>

<body>

<div id="loading-overlay">

    <div id="status-text"
         style="font-size:20px; margin-bottom:10px;">
        Envoi en cours...
    </div>

    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div id="percent-text" style="margin-top:10px;">
        0%
    </div>

    <button
        onclick="cancelUpload()"
        style="width:auto; margin-top:20px; background:var(--danger); color:white;"
    >
        ANNULER
    </button>

</div>

<div id="success-popup"
     onclick="this.style.display='none'">

    <div style="background:white; color:black; padding:20px; border-radius:10px; font-weight:bold;">
        ✅ Synchronisation effectuée avec succès !
    </div>

</div>

<div class="container">

    <h2>PANEL OPÉRATEUR - DRAKKAR</h2>

    <div class="grid">

        <div class="card">

            <span class="card-title">
                🚨 Annonces Prioritaires
            </span>

            <button
                onclick="sendCommand('SECURITE')"
                style="background:#f39c12; color:white;"
            >
                SÉCURITÉ
            </button>

            <button
                onclick="sendCommand('TECHNIQUE')"
                style="background:var(--info); color:white;"
            >
                TECHNIQUE
            </button>

            <button
                onclick="sendCommand('FERMETURE')"
                style="background:#6c757d; color:white;"
            >
                FERMETURE
            </button>

            <button
                onclick="sendCommand('STOP_ANNONCE')"
                style="background:var(--danger); color:white;"
            >
                ARRÊTER ANNONCE
            </button>

        </div>

        <div class="card">

            <span class="card-title">
                📅 Planning & Forçage
            </span>

            <div
                id="status_mode"
                style="padding:10px; margin-bottom:10px; text-align:center; border-radius:5px; font-weight:bold; background:#eee;"
            >
                MODE : CHARGEMENT...
            </div>

            <div style="display:flex; gap:5px;">

                <input type="time" id="h_ouv">

                <input type="time" id="h_ferm">

            </div>

            <div style="font-size:12px; margin-top:10px;">
                Sélectionnez les dates d'ouverture :
            </div>

            <input type="date" id="date_input">

            <button onclick="addDate()">
                + AJOUTER DATE SPÉCIALE
            </button>

            <div id="date_list" style="margin:10px 0;"></div>

            <button
                class="btn-update"
                onclick="updateSchedule()"
            >
                VALIDER PLANNING
            </button>

            <div
                style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px; margin-top:10px;"
            >

                <button
                    onclick="setForce('OPEN')"
                    style="background:var(--success); color:white; font-size:10px;"
                >
                    OUVERT
                </button>

                <button
                    onclick="setForce('CLOSE')"
                    style="background:var(--danger); color:white; font-size:10px;"
                >
                    FERMÉ
                </button>

                <button
                    onclick="setForce('AUTO')"
                    style="background:var(--info); color:white; font-size:10px;"
                >
                    RETOUR AUTO
                </button>

            </div>

        </div>

        <div class="card">

            <span class="card-title">
                ⚙️ Paramètres & Musique
            </span>

            <div style="display:flex; gap:5px; margin-bottom:10px;">

                <button
                    onclick="setWaitTime(true)"
                    style="background:var(--success); color:white;"
                >
                    Attente: OUI
                </button>

                <button
                    onclick="setWaitTime(false)"
                    style="background:var(--danger); color:white;"
                >
                    Attente: NON
                </button>

            </div>

            <input
                type="number"
                id="capacite"
                placeholder="Capacité"
            >

            <input
                type="number"
                id="int_calc"
                placeholder="Intervalle calcul (s)"
            >

            <div style="display:flex; gap:5px;">

                <input
                    type="number"
                    id="secu_h"
                    placeholder="H"
                >

                <input
                    type="number"
                    id="secu_m"
                    placeholder="M"
                >

                <input
                    type="number"
                    id="secu_s"
                    placeholder="S"
                >

            </div>

            <button
                class="btn-update"
                onclick="updateParams()"
            >
                VALIDER PARAMÈTRES
            </button>

            <hr style="margin:15px 0;">

            <input
                type="file"
                id="file_music"
                accept="audio/mp3"
            >

            <button
                class="btn-update"
                onclick="uploadMusic()"
                style="background:var(--info);"
            >
                CHARGER MUSIQUE MP3
            </button>

        </div>

    </div>

</div>

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        update,
        onValue
    } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    import {
        getStorage,
        ref as storageRef,
        uploadBytesResumable,
        getDownloadURL
    } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

    const firebaseConfig = {

        apiKey: "AIzaSyDWob3NIJTPxrdpreSpDr__eaPJA2ZCTl0",

        databaseURL:
            "https://attraction-info-default-rtdb.europe-west1.firebasedatabase.app",

        projectId: "attraction-info",

        storageBucket:
            "attraction-info.firebasestorage.app"
    };

    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);

    const dbRef = ref(
        db,
        'attractions/DRAKKAR'
    );

    const storage = getStorage(app);

    let currentTask = null;

    window.showSuccess = () => {

        const p = document.getElementById(
            'success-popup'
        );

        p.style.display = 'flex';

        setTimeout(() => {

            p.style.display = 'none';

        }, 2500);
    };

    onValue(dbRef, (snapshot) => {

        const data = snapshot.val();

        if(!data) return;

        const modeEl =
            document.getElementById('status_mode');

        modeEl.innerText =
            data.mode_auto
                ? "MODE : AUTOMATIQUE"
                : "MODE : MANUEL (FORCÉ)";

        modeEl.style.color =
            data.mode_auto
                ? "var(--info)"
                : "var(--danger)";

        modeEl.style.background =
            data.mode_auto
                ? "#e1f5fe"
                : "#ffebee";

        if(data.intervalle_calcul) {

            document.getElementById(
                'int_calc'
            ).value = data.intervalle_calcul;
        }

        if(data.intervalle_secu !== undefined) {

            const total =
                parseInt(data.intervalle_secu) || 0;

            const h = Math.floor(total / 3600);

            const m = Math.floor(
                (total % 3600) / 60
            );

            const s = total % 60;

            document.getElementById(
                'secu_h'
            ).value = h;

            document.getElementById(
                'secu_m'
            ).value = m;

            document.getElementById(
                'secu_s'
            ).value = s;
        }

    });

    window.sendCommand = (cmd) => {

        update(dbRef, {

            commande_test: cmd

        }).then(() => {

            showSuccess();

        });
    };

    window.setWaitTime = (val) => {

        update(dbRef, {

            show_wait_time: val

        }).then(() => {

            showSuccess();

        });
    };

    window.updateParams = () => {

        const h = Number(
            document.getElementById('secu_h').value || 0
        );

        const m = Number(
            document.getElementById('secu_m').value || 0
        );

        const s = Number(
            document.getElementById('secu_s').value || 0
        );

        const total_secu =
            (h * 3600) +
            (m * 60) +
            s;

        update(dbRef, {

            capacite: Number(
                document.getElementById('capacite').value || 0
            ),

            intervalle_secu: total_secu,

            intervalle_calcul: Number(
                document.getElementById('int_calc').value || 7
            )

        }).then(() => {

            console.log(
                "[PANEL] intervalle_secu envoyé =",
                total_secu
            );

            showSuccess();

        });
    };

</script>

</body>
</html>
